name: diag-substrate

on:
  workflow_dispatch:
    inputs:
      asset_id:
        required: true

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: fetch ipa
        env:
          T: ${{ github.token }}
          AID: ${{ inputs.asset_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w"
          curl -fSL -H "Authorization: Bearer $T" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/$AID" \
            -o "$RUNNER_TEMP/src.ipa"
          ls -lh "$RUNNER_TEMP/src.ipa"

      - name: import cert
        env:
          P12B64: ${{ secrets.SIGN_P12_B64 }}
          P12PW: ${{ secrets.SIGN_P12_PASS }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          printf '%s' "$P12B64" | base64 --decode > sign.p12
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KC_PW" build.keychain
          security import sign.p12 -k build.keychain -P "$P12PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning

      - name: extract framework
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p ex
          unzip -qo src.ipa "Payload/WeChat.app/Frameworks/CydiaSubstrate.framework/*" -d ex
          ls -la ex/Payload/WeChat.app/Frameworks/CydiaSubstrate.framework

      - name: probe
        run: |
          set +e
          D="$RUNNER_TEMP/ex/Payload/WeChat.app/Frameworks/CydiaSubstrate.framework"
          cd "$D"
          echo "===== ls ====="; ls -la
          echo "===== file ====="; file CydiaSubstrate
          echo "===== xattr ====="; xattr -l CydiaSubstrate
          echo "===== LC_ID_DYLIB ====="; otool -l CydiaSubstrate | grep -A4 LC_ID_DYLIB
          echo "===== existing sig ====="; codesign -dvvv CydiaSubstrate 2>&1 | head -20
          echo "===== remove ====="; codesign --remove-signature CydiaSubstrate; echo "rc=$?"
          echo "===== sign file ====="; codesign --force --sign "Apple Distribution: guoping ni (9VSZ8M2JL5)" CydiaSubstrate; echo "rc=$?"
          echo "===== sign bundle ====="; codesign --force --sign "Apple Distribution: guoping ni (9VSZ8M2JL5)" "$D"; echo "rc=$?"
          echo "===== sign bundle runtime ====="; codesign --force --sign "Apple Distribution: guoping ni (9VSZ8M2JL5)" --options runtime "$D"; echo "rc=$?"
          echo "===== codesign version ====="; codesign --version 2>&1 | head -3
